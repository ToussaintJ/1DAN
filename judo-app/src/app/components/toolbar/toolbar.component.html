<div class="toolbar container">
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15.5 15.5L21 21" stroke="#9aa4b2" stroke-width="1.7" stroke-linecap="round" />
      <circle cx="10.5" cy="10.5" r="6.5" stroke="#9aa4b2" stroke-width="1.7" />
    </svg>
    <input type="search" [formControl]="searchControl" placeholder="Rechercher (ex: uchi, hanche, étranglement, …)" />
  </label>
  <button class="btn" type="button" (click)="toggleAll.emit()">Tout ouvrir / fermer</button>
</div>
